name: Sync upstream releases

# Follows mcmilk/7-Zip-zstd tags: builds the wasm bundle from the newest
# upstream tag and publishes a GitHub Release with the SAME tag name
# (e.g. v26.02-v1.5.7-R2). Idempotent: skips tags already released here
# unless manually dispatched with overwrite=true (replaces release assets).
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (default: newest tag)'
        required: false
      overwrite:
        description: 'Replace assets of an existing release with the same tag'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream tag and commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM="mcmilk/7-Zip-zstd"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            # Accept both "v26.02-v1.5.7-R2" and "refs/tags/v26.02-v1.5.7-R2".
            TAG="${TAG#refs/tags/}"
          else
            # Pick the newest tag by version instead of trusting
            # releases/latest: the "latest" release may point at an older tag.
            TAG=$(gh api "repos/$UPSTREAM/tags" --paginate -q '.[].name' \
              | sort -V \
              | tail -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve upstream tag"
            exit 1
          fi
          # Peel annotated tags to the commit SHA so the checkout stays pinned
          # even if the tag is moved or recreated later.
          REF=$(gh api "repos/$UPSTREAM/git/ref/tags/$TAG" 2>/dev/null) || {
            echo "::error::upstream tag '$TAG' not found in $UPSTREAM (expected e.g. v26.02-v1.5.7-R2)"
            exit 1
          }
          if [ "$(printf '%s' "$REF" | jq -r '.object.type')" = "tag" ]; then
            TAG_OBJ=$(printf '%s' "$REF" | jq -r '.object.sha')
            SHA=$(gh api "repos/$UPSTREAM/git/tags/$TAG_OBJ" -q '.object.sha')
          else
            SHA=$(printf '%s' "$REF" | jq -r '.object.sha')
          fi
          if [ -z "$SHA" ]; then
            echo "::error::could not resolve commit for tag $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG (commit: $SHA)"

      - name: Skip if already released
        id: check
        run: |
          if gh release view "${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.overwrite }}" = "true" ]; then
              echo "already released; overwriting assets: ${{ steps.resolve.outputs.tag }}"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "overwrite=true" >> "$GITHUB_OUTPUT"
            else
              echo "already released: ${{ steps.resolve.outputs.tag }}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout upstream tag
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: mcmilk/7-Zip-zstd
          ref: ${{ steps.resolve.outputs.commit }}
          path: src-7zip

      - name: Set up Emscripten
        if: steps.check.outputs.skip == 'false'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.5

      - name: Build 7zz.wasm
        if: steps.check.outputs.skip == 'false'
        run: |
          ./build/build-wasm.sh --src src-7zip --out out --bundle 7zz
          {
            echo "tag=${{ steps.resolve.outputs.tag }}"
            echo "upstream_commit=${{ steps.resolve.outputs.commit }}"
            echo "build_repo_commit=$GITHUB_SHA"
          } > out/VERSION

      - name: Test (Node)
        if: steps.check.outputs.skip == 'false'
        run: node test/test-wasm.js out

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          UPSTREAM_COMMIT="${{ steps.resolve.outputs.commit }}"
          NOTES="7-Zip ZS $TAG compiled to WebAssembly (multi-threaded, Emscripten).

          Built from upstream tag $TAG at commit $UPSTREAM_COMMIT
          (https://github.com/mcmilk/7-Zip-zstd/commit/$UPSTREAM_COMMIT).
          Build repo commit: $GITHUB_SHA

          - 7zz.js/7zz.wasm: full-featured 7zz (all formats)
          - 7zz-api.js: JS API wrapper (createApi -> run(argv, {files, stdin}))
          - Browser: needs SharedArrayBuffer (COOP/COEP headers)
          - Node: works out of the box"
          if [ "${{ steps.check.outputs.overwrite }}" = "true" ]; then
            gh release upload "$TAG" \
              out/7zz.js out/7zz.wasm out/7zz-api.js out/LICENSE out/VERSION \
              --clobber
            gh release edit "$TAG" \
              --title "7-Zip ZS $TAG (WebAssembly)" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              out/7zz.js out/7zz.wasm out/7zz-api.js out/LICENSE out/VERSION \
              --title "7-Zip ZS $TAG (WebAssembly)" \
              --notes "$NOTES"
          fi
