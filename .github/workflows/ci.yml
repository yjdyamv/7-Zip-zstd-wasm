name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout 7-Zip-zstd (upstream master)
        uses: actions/checkout@v4
        with:
          repository: mcmilk/7-Zip-zstd
          path: src-7zip

      - name: Set up Emscripten
        uses: myMindstorm/setup-emsdk@v14
        with:
          version: 3.1.77

      - name: Build 7zz.wasm
        run: ./build/build-wasm.sh --src src-7zip --out out --bundle 7zz

      - name: Test (Node)
        run: node test/test-wasm.js out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 7zz-wasm
          path: out/
